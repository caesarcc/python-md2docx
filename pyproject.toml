[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-md2pdf"
version = "0.1.0"
description = "Converte arquivos Markdown (.md) em PDF com formatação limpa e suporte a estilos personalizados."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "markdown>=3.5",
    "xhtml2pdf>=0.2.15",
    "pygments>=2.17",
]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[tool.setuptools.packages.find]
include = ["md2pdf*"]
