[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-md2docx"
version = "0.2.0"
description = "Converte arquivos Markdown (.md) em documentos Word (.docx) com formatação limpa e suporte a diagramas SVG."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "markdown>=3.5",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
    "pygments>=2.17",
]

[project.scripts]
md2docx = "md2docx.cli:main"
md2pdf = "md2docx.cli:main"

[tool.setuptools.packages.find]
include = ["md2docx*"]
